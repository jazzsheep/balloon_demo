<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>巨大ビニール風船 — 風シミュレーション</title>
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Three.js を ES モジュールとして解決するための import map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hint">
    <b>カーソルを風船に当てて風を送る</b><br />ドラッグで視点を回転
  </div>

  <div id="panel">
    <div class="row">
      <label>風の強さ <span class="val" id="windVal">8</span></label>
      <input type="range" id="wind" min="0" max="25" step="0.5" value="8" />
    </div>
    <div class="row">
      <label>張り（内圧） <span class="val" id="pressVal">80</span></label>
      <input type="range" id="press" min="15" max="220" step="5" value="80" />
    </div>
    <div class="row">
      <label>膜のやわらかさ <span class="val" id="softVal">0.92</span></label>
      <input type="range" id="soft" min="0.5" max="1" step="0.01" value="0.92" />
    </div>
    <div class="row">
      <button id="reset">形をリセット</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
